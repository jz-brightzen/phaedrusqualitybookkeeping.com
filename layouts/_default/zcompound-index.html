<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Params.summary | default .Description }}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-950: #071726;
      --navy-900: #0b1f33;
      --navy-800: #12324a;
      --blue-700: #146c94;
      --teal-500: #2a9d98;
      --teal-300: #39d0c6;
      --mist-100: #eaf4f6;
      --cloud-50: #f8fbfc;
      --slate-600: #526578;
      --white: #ffffff;
      --border: rgba(11, 31, 51, 0.14);
      --shell: min(800px, calc(100vw - 40px));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--navy-900); background: var(--cloud-50);
      font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.6;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3 { font-family: "Manrope", sans-serif; letter-spacing: -0.045em; font-weight: 600; }

    /* Header */
    .site-header {
      background: rgba(7, 23, 38, 0.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .header-inner {
      max-width: var(--shell); margin: 0 auto;
      height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .header-brand { color: var(--white); font-family: "Manrope", sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }
    .header-brand span { color: var(--teal-300); }

    /* Main */
    .page-main {
      flex: 1; max-width: var(--shell); margin: 0 auto; padding: 80px 20px;
      width: 100%;
    }
    .eyebrow {
      color: var(--teal-500); text-transform: uppercase; letter-spacing: 0.14em;
      font-size: 12px; font-weight: 700; margin-bottom: 16px;
    }
    .page-main h1 {
      font-size: clamp(36px, 5vw, 52px); line-height: 1.06; margin-bottom: 16px;
    }
    .page-lede {
      color: var(--slate-600); font-size: 18px; line-height: 1.55; margin-bottom: 48px;
      max-width: 600px;
    }

    /* Cards */
    .page-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    }
    @media (max-width: 600px) { .page-grid { grid-template-columns: 1fr; } }

    .page-card {
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      padding: 36px 32px; transition: transform 0.2s, box-shadow 0.2s;
    }
    .page-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 48px rgba(7, 23, 38, 0.1);
    }
    .card-number {
      display: inline-block; width: 32px; height: 32px; border-radius: 8px;
      background: var(--mist-100); color: var(--teal-500);
      font: 700 13px/32px "Manrope", sans-serif; text-align: center;
      margin-bottom: 16px;
    }
    .card-title {
      font: 600 22px/1.2 "Manrope", sans-serif; letter-spacing: -0.03em;
      margin-bottom: 8px; color: var(--navy-900);
    }
    .card-desc {
      color: var(--slate-600); font-size: 14px; line-height: 1.55; margin-bottom: 20px;
    }
    .card-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--teal-500); font-weight: 700; font-size: 14px;
      transition: color 0.2s;
    }
    .card-link:hover { color: var(--teal-300); }
    .card-link::after { content: "→"; }

    /* Footer */
    .site-footer {
      padding: 32px 0; text-align: center;
      background: var(--navy-950); color: rgba(255,255,255,0.45); font-size: 12px;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="/zcompound/">zCompound<span></span></a>
    </div>
  </header>

  <main class="page-main">
    <p class="eyebrow">PQB</p>
    <h1>zCompound</h1>
    <p class="page-lede">Personal company pages. Annual expense charts first.</p>

    <div class="page-grid">
      <a class="page-card" href="/zcompound/expenses/">
        <div class="card-number">01</div>
        <div class="card-title">Annual expenses</div>
        <p class="card-desc">Six vendor and category charts. As of 2026-09-09. Noindex.</p>
        <span class="card-link">View charts</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>zCompound · Draft pages</p>
  </footer>

</body>
</html>
