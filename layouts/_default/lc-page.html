<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Params.summary | default .Title }}">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #faf8f4; color: #1f2a2e; font-family: Georgia, "Times New Roman", serif; line-height: 1.65; }
    .lc-header { border-bottom: 1px solid #e4ded3; background: #fff; }
    .lc-header .inner { max-width: 760px; margin: 0 auto; padding: 18px 20px; font: 700 18px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.02em; }
    main { max-width: 760px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 22px; margin: 32px 0 8px; }
    p, li { font-size: 17px; }
    ul { padding-left: 22px; }
    a { color: #1d5f6b; }
    .lc-footer { border-top: 1px solid #e4ded3; padding: 24px 20px 40px; text-align: center; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #6b7275; }
  </style>
</head>
<body>
  <header class="lc-header"><div class="inner">Leucadia Club</div></header>
  <main>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </main>
  <footer class="lc-footer">Leucadia Club · 828 N Coast Hwy Ste E, Encinitas, CA 92024 · <a href="/lc/privacy-policy/">Privacy Policy</a> · <a href="/lc/sms-terms/">SMS Terms</a></footer>
</body>
</html>
