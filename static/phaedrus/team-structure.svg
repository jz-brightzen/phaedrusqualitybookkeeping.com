<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DM Sans, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#fbf8f2"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5b5b5b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f7d6d"/></marker>
  </defs>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#222">How the Phaedrus team works</text>
  <!-- top -->
  <rect x="300" y="62" width="300" height="78" rx="14" fill="#1f3b57"/>
  <text x="450" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">John + Phaedrus 🌈</text>
  <text x="450" y="121" text-anchor="middle" font-size="14" fill="#d6e2ee">Call the shots · write the book together</text>
  <!-- three bots -->
  <g font-size="16" font-weight="700" fill="#222" text-anchor="middle">
    <rect x="60" y="230" width="220" height="80" rx="12" fill="#fff" stroke="#c9a54a" stroke-width="2"/>
    <text x="170" y="263">Research Bot</text>
    <text x="170" y="287" font-size="13" font-weight="400" fill="#555">Sources, fact checks, other writers</text>
    <rect x="340" y="230" width="220" height="80" rx="12" fill="#fff" stroke="#c9a54a" stroke-width="2"/>
    <text x="450" y="263">On Writing Well Editor</text>
    <text x="450" y="287" font-size="13" font-weight="400" fill="#555">Zinsser-style feedback on drafts</text>
    <rect x="620" y="230" width="220" height="80" rx="12" fill="#fff" stroke="#c9a54a" stroke-width="2"/>
    <text x="730" y="263">Content Writer</text>
    <text x="730" y="287" font-size="13" font-weight="400" fill="#555">Drafts and shapes content</text>
  </g>
  <text x="450" y="200" text-anchor="middle" font-size="13" fill="#7a6a3a" font-style="italic">Phaedrus's team</text>
  <g stroke="#5b5b5b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M450,140 L450,175 L170,175 L170,228"/>
    <path d="M450,175 L450,228"/>
    <path d="M450,175 L730,175 L730,228"/>
  </g>
  <!-- bottom -->
  <rect x="60" y="410" width="330" height="96" rx="12" fill="#e4f2ee" stroke="#2f7d6d" stroke-width="2"/>
  <text x="225" y="445" text-anchor="middle" font-size="17" font-weight="700" fill="#1d5247">Phaedrus Web Manager</text>
  <text x="225" y="470" text-anchor="middle" font-size="13" fill="#2f5d54">Direct line, but only for</text>
  <text x="225" y="489" text-anchor="middle" font-size="13" fill="#2f5d54">the /phaedrus section of the site</text>
  <rect x="510" y="410" width="330" height="96" rx="12" fill="#efeaf6" stroke="#6a4c93" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="675" y="445" text-anchor="middle" font-size="17" font-weight="700" fill="#45306a">Anything else</text>
  <text x="675" y="470" text-anchor="middle" font-size="13" fill="#5a4580">Phaedrus asks John</text>
  <text x="675" y="489" text-anchor="middle" font-size="13" fill="#5a4580">what to do.</text>
  <path d="M300,100 L30,100 L30,458 L58,458" stroke="#2f7d6d" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <text x="38" y="365" font-size="12" fill="#2f7d6d" font-weight="700">direct</text>
  
  
  <text x="450" y="540" text-anchor="middle" font-size="12" fill="#888">Updated October 31, 2026</text>
</svg>
